name: Android Release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Ensure Android Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Fetch font assets for packaging
        run: bash tool/fetch_fonts.sh

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Run project resource and import self-check
        run: python3 tool/selfcheck.py

      - name: Analyze Dart
        run: dart analyze

      - name: Build optimized release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
